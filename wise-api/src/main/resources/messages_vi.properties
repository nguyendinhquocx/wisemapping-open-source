# HTTP error contract (resolved by GlobalExceptionHandler)
RATE_LIMIT_EXCEEDED=Quá nhiều yêu cầu. Vui lòng thử lại sau.
INVALID_REQUEST=Yêu cầu không hợp lệ. Nội dung yêu cầu bắt buộc bị thiếu hoặc không đúng định dạng.
REQUEST_VALIDATION_ERROR=Yêu cầu chứa các giá trị không hợp lệ. Vui lòng sửa chúng và thử lại.
MISSING_REQUEST_PARAMETER=Thiếu tham số yêu cầu bắt buộc {0}.
INVALID_PARAMETER_VALUE=Giá trị được cung cấp cho tham số yêu cầu {0} không hợp lệ.
METHOD_NOT_SUPPORTED=Phương thức HTTP {0} không được tài nguyên này hỗ trợ.
MEDIA_TYPE_NOT_SUPPORTED=Loại nội dung của yêu cầu không được tài nguyên này hỗ trợ.
MEDIA_TYPE_NOT_ACCEPTABLE=Định dạng phản hồi mà ứng dụng khách chấp nhận không được tài nguyên này hỗ trợ.
RESOURCE_NOT_FOUND=Không tìm thấy tài nguyên được yêu cầu.

