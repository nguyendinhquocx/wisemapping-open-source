ACCESS_HAS_BEEN_REVOKED=Quyền truy cập của bạn vào bản đồ này đã bị thu hồi. Liên hệ với chủ sở hữu bản đồ.
INVALID_CREDENTIALS=Địa chỉ email hoặc mật khẩu bạn nhập không hợp lệ. Vui lòng thử lại.
ACCOUNT_USES_GOOGLE_OAUTH=Tài khoản này đã được đăng ký với Google. Vui lòng sử dụng nút 'Đăng nhập bằng Google' để đăng nhập.
ACCOUNT_USES_OIDC_OAUTH=Tài khoản này dùng đăng nhập một lần (Single Sign-On). Vui lòng sử dụng nút đăng nhập một lần để đăng nhập.
ACCOUNT_USES_FACEBOOK_OAUTH=Tài khoản này đã được đăng ký với Facebook. Vui lòng sử dụng nút 'Đăng nhập bằng Facebook' để đăng nhập.
ACCOUNT_USES_EXTERNAL_AUTH=Tài khoản này sử dụng xác thực bên ngoài. Vui lòng sử dụng phương thức đăng nhập thích hợp.
ACCOUNT_SUSPENDED=Tài khoản của bạn đã bị đình chỉ. Vui lòng liên hệ bộ phận hỗ trợ.
ACCOUNT_SUSPENDED_INACTIVITY=Tài khoản của bạn đã bị đình chỉ do lâu ngày không hoạt động. Vui lòng liên hệ bộ phận hỗ trợ.
ACCOUNT_DISABLED=Tài khoản của bạn chưa được kích hoạt. Vui lòng kiểm tra email của bạn để biết hướng dẫn kích hoạt.
LOCAL_LOGIN_DISABLED=Đăng nhập bằng email và mật khẩu không được bật trên trang web này. Vui lòng sử dụng nút đăng nhập một lần (Single Sign-On).
SUSPENDED_USER_CANNOT_CREATE_MAPS=Tài khoản bị đình chỉ không thể tạo bản đồ. Vui lòng liên hệ bộ phận hỗ trợ.
SUSPENDED_USER_CANNOT_DUPLICATE_MAPS=Tài khoản bị đình chỉ không thể sao chép bản đồ. Vui lòng liên hệ bộ phận hỗ trợ.
SUSPENDED_USER_CANNOT_PUBLISH_MAPS=Tài khoản bị đình chỉ không thể xuất bản bản đồ. Vui lòng liên hệ bộ phận hỗ trợ.
SUSPENDED_USER_MAP_NOT_AVAILABLE=Bản đồ này không còn khả dụng vì tài khoản của người tạo đã bị đình chỉ.
ACCOUNT_NOT_ACTIVATED_YET=Tài khoản của bạn chưa được kích hoạt. Vui lòng kiểm tra email của bạn để lấy liên kết kích hoạt.
MAP_CAN_NOT_BE_FOUND=Không tìm thấy bản đồ. Có thể bản đồ đã bị xóa.
LABEL_CAN_NOT_BE_FOUND=Không tìm thấy nhãn. Có thể nhãn đã bị xóa.
MINDMAP_TIMESTAMP_OUTDATED=Không thể lưu các thay đổi của bạn vì bản đồ tư duy của bạn đã được sửa đổi bởi ''{0}''. Hãy làm mới trang và thử lại.
MINDMAP_IS_LOCKED=Bản đồ tư duy đang bị khóa để chỉnh sửa.
